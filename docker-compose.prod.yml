services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: emotion_map
      POSTGRES_USER: emotion_map
      POSTGRES_PASSWORD: emotion_map
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U emotion_map -d emotion_map']
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    image: ghcr.io/wonderlandpark/mind-map:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media_data:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
